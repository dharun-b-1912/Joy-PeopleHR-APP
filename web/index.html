<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="JOY PeopleHR Enterprise WorkforceOS">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Permissions-Policy" content="geolocation=(self)">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="JOY PeopleHR">
  <meta name="format-detection" content="telephone=no">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>JOY PeopleHR</title>
  <link rel="manifest" href="manifest.json">

  <!-- iOS Safari & Android Chrome Geolocation Acceleration Bridge -->
  <script>
    window.joyLastKnownLocation = null;
    window.joyGetLiveLocation = function(highAccuracy, timeoutMs) {
      return new Promise(function(resolve, reject) {
        if (!navigator.geolocation) {
          reject(new Error("GEOLOCATION_UNSUPPORTED"));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          function(pos) {
            var loc = {
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              accuracy: pos.coords.accuracy || 10,
              timestamp: pos.timestamp || Date.now()
            };
            window.joyLastKnownLocation = loc;
            resolve(loc);
          },
          function(err) {
            // Graceful fallback for iOS Safari when indoors / GPS cold start takes > 10s
            if (highAccuracy !== false && (err.code === 3 || err.code === 2)) {
              navigator.geolocation.getCurrentPosition(
                function(pos2) {
                  var loc2 = {
                    lat: pos2.coords.latitude,
                    lng: pos2.coords.longitude,
                    accuracy: pos2.coords.accuracy || 15,
                    timestamp: pos2.timestamp || Date.now()
                  };
                  window.joyLastKnownLocation = loc2;
                  resolve(loc2);
                },
                function(err2) {
                  reject(err2);
                },
                { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
              );
            } else {
              reject(err);
            }
          },
          {
            enableHighAccuracy: highAccuracy !== false,
            timeout: timeoutMs || 14000,
            maximumAge: 0
          }
        );
      });
    };

    // Auto-prompt on initial page load (Immediately triggers Chrome & Android permission dialog)
    (function() {
      try {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function(p) {
              window.joyLastKnownLocation = {
                lat: p.coords.latitude,
                lng: p.coords.longitude,
                accuracy: p.coords.accuracy || 10,
                timestamp: p.timestamp || Date.now()
              };
              console.log("[JOY GPS Web] Startup location warmed up successfully:", window.joyLastKnownLocation.lat, window.joyLastKnownLocation.lng);
            },
            function(e) {
              console.log("[JOY GPS Web] Startup warmup notice (will retry on user gesture):", e.message);
            },
            { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
          );
        }
      } catch(e) {}

      // Also trigger on first user interaction (Satisfies iOS Safari strict user-gesture requirement)
      var _gestureTriggered = false;
      function _warmupOnFirstInteraction() {
        if (_gestureTriggered) return;
        _gestureTriggered = true;
        if (window.joyGetLiveLocation) {
          window.joyGetLiveLocation(true, 12000).catch(function(){});
        }
        ['click', 'touchstart', 'pointerdown', 'keydown'].forEach(function(evt) {
          window.removeEventListener(evt, _warmupOnFirstInteraction);
        });
      }
      ['click', 'touchstart', 'pointerdown', 'keydown'].forEach(function(evt) {
        window.addEventListener(evt, _warmupOnFirstInteraction, { once: true, passive: true });
      });
    })();
  </script>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
