<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="JOY PeopleHR Enterprise WorkforceOS">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Permissions-Policy" content="geolocation=(self)">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="JOY PeopleHR">
  <meta name="format-detection" content="telephone=no">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>JOY PeopleHR</title>
  <link rel="manifest" href="manifest.json">

  <!-- iOS Safari & Android Chrome Enterprise Geolocation Bridge -->
  <script>
    window.joyLastKnownLocation = null;
    window.joyLastLocationError = null;

    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    // Master Geolocation Function with Multi-Tier Fallback for iOS & Android
    window.joyFetchLocation = function(onSuccess, onError, highAccuracy, timeoutMs) {
      if (!navigator.geolocation) {
        if (onError) onError("GEOLOCATION_UNSUPPORTED");
        return;
      }

      // 1. If we already have a fresh cached position (< 60s), return immediately!
      if (window.joyLastKnownLocation) {
        var age = Date.now() - (window.joyLastKnownLocation.timestamp || 0);
        if (age < 60000 && window.joyLastKnownLocation.lat !== 0) {
          console.log("[JOY GPS] Using cached position (age: " + Math.round(age/1000) + "s)");
          if (onSuccess) onSuccess(window.joyLastKnownLocation);
          return;
        }
      }

      // Tier 1: Try with enableHighAccuracy: false first on iOS to guarantee instant response (< 500ms)
      // On Android/desktop, use requested highAccuracy.
      var useHigh = (highAccuracy === true) && !isIOS;
      var timeout = timeoutMs || 15000;

      function onPositionSuccess(pos) {
        var loc = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy || 10,
          timestamp: pos.timestamp || Date.now()
        };
        window.joyLastKnownLocation = loc;
        window.joyLastLocationError = null;
        console.log("[JOY GPS] Position acquired:", loc.lat, loc.lng, "accuracy:", loc.accuracy);
        if (onSuccess) onSuccess(loc);

        // Tier 3: If on iOS and high accuracy was requested, refine asynchronously in background
        if (isIOS && highAccuracy === true) {
          try {
            navigator.geolocation.getCurrentPosition(
              function(hiPos) {
                if (hiPos && hiPos.coords) {
                  window.joyLastKnownLocation = {
                    lat: hiPos.coords.latitude,
                    lng: hiPos.coords.longitude,
                    accuracy: hiPos.coords.accuracy || 5,
                    timestamp: hiPos.timestamp || Date.now()
                  };
                  console.log("[JOY GPS] iOS GPS refined:", hiPos.coords.latitude, hiPos.coords.longitude);
                }
              },
              function() {},
              { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
            );
          } catch(e) {}
        }
      }

      function onPositionError(err) {
        console.warn("[JOY GPS] Primary position error:", err.code, err.message);
        window.joyLastLocationError = { code: err.code, message: err.message };

        // Fallback for iOS indoors / cold GPS: retry with maximumAge: 300000 (5 min) and false
        navigator.geolocation.getCurrentPosition(
          function(pos2) {
            var loc2 = {
              lat: pos2.coords.latitude,
              lng: pos2.coords.longitude,
              accuracy: pos2.coords.accuracy || 25,
              timestamp: pos2.timestamp || Date.now()
            };
            window.joyLastKnownLocation = loc2;
            if (onSuccess) onSuccess(loc2);
          },
          function(err2) {
            console.error("[JOY GPS] Fallback also failed:", err2.code, err2.message);
            if (onError) onError(err2.message || "POSITION_UNAVAILABLE");
          },
          { enableHighAccuracy: false, timeout: 20000, maximumAge: 300000 }
        );
      }

      navigator.geolocation.getCurrentPosition(
        onPositionSuccess,
        onPositionError,
        {
          enableHighAccuracy: useHigh,
          timeout: timeout,
          maximumAge: isIOS ? 60000 : 0
        }
      );
    };

    // Promise wrapper for Dart / JS calls
    window.joyGetLiveLocation = function(highAccuracy, timeoutMs) {
      return new Promise(function(resolve, reject) {
        window.joyFetchLocation(
          function(loc) { resolve(loc); },
          function(err) { reject(new Error(err)); },
          highAccuracy,
          timeoutMs
        );
      });
    };

    // Platform-specific Initialization:
    // IMPORTANT: On iOS, NEVER call getCurrentPosition on page load! (Safari blocks ungestured calls)
    // On Android / Desktop, page-load warmup is permitted.
    if (!isIOS) {
      try {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function(p) {
              window.joyLastKnownLocation = {
                lat: p.coords.latitude,
                lng: p.coords.longitude,
                accuracy: p.coords.accuracy || 10,
                timestamp: p.timestamp || Date.now()
              };
              console.log("[JOY GPS] Android/Desktop startup position cached:", window.joyLastKnownLocation.lat, window.joyLastKnownLocation.lng);
            },
            function(e) {
              console.log("[JOY GPS] Startup notice:", e.message);
            },
            { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
          );
        }
      } catch(e) {}
    } else {
      console.log("[JOY GPS] iOS detected (Safari/WebKit). Waiting for active user touch to trigger native prompt...");
      var _iosTriggered = false;
      function _onFirstIosUserGesture() {
        if (_iosTriggered) return;
        _iosTriggered = true;
        ['touchstart', 'touchend', 'click', 'pointerdown'].forEach(function(evt) {
          window.removeEventListener(evt, _onFirstIosUserGesture, true);
          document.removeEventListener(evt, _onFirstIosUserGesture, true);
        });
        console.log("[JOY GPS] User touch gesture detected on iOS, initiating native prompt...");
        window.joyFetchLocation(null, null, false, 15000);
      }
      ['touchstart', 'touchend', 'click', 'pointerdown'].forEach(function(evt) {
        window.addEventListener(evt, _onFirstIosUserGesture, { capture: true, passive: true });
        document.addEventListener(evt, _onFirstIosUserGesture, { capture: true, passive: true });
      });
    }
  </script>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
