  <link rel="manifest" href="manifest.json">

  <!-- iOS Safari Geolocation Acceleration Bridge -->
  <script>
    window.joyGetLiveLocation = function(highAccuracy, timeoutMs) {
      return new Promise(function(resolve, reject) {
        if (!navigator.geolocation) {
          reject(new Error("GEOLOCATION_UNSUPPORTED"));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          function(pos) {
            resolve({
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              accuracy: pos.coords.accuracy || 10,
              timestamp: pos.timestamp || Date.now()
            });
          },
          function(err) {
            // Graceful fallback for iOS Safari when indoors / GPS cold start takes > 10s
            if (highAccuracy !== false && (err.code === 3 || err.code === 2)) {
              navigator.geolocation.getCurrentPosition(
                function(pos2) {
                  resolve({
                    lat: pos2.coords.latitude,
                    lng: pos2.coords.longitude,
                    accuracy: pos2.coords.accuracy || 15,
                    timestamp: pos2.timestamp || Date.now()
                  });
                },
                function(err2) {
                  reject(err2);
                },
                { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
              );
            } else {
              reject(err);
            }
          },
          {
            enableHighAccuracy: highAccuracy !== false,
            timeout: timeoutMs || 14000,
            maximumAge: 0
          }
        );
      });
    };
  </script>
</head>
